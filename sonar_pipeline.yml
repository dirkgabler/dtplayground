name: SonarQube-PR-Decoration-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  branches:
    include:
      - '*'

parameters:
  - name: sonarQubeBuildGoals
    displayName: "Maven Goals zur Ausführung von Sonarqube"
    type: string
    default: 'verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar'
  - name: sonarQubeServiceConnection
    displayName: "Sonarqube Service Connection (konfiguriert im Azure DevOps Projekt)"
    type: string
    default: 'SonarQubeEnterprise_PROD'
  - name: pomPath
    displayName: "Relativer Pfad der pom.xml zum Repository-Root"
    type: string
    default: '/'

pool:
  name: 'Self-hosted Linux (SEU)'

variables:
  - group: pipelines_sccm_rsc

stages:
  - stage: MAVEN_SonarQube
    jobs:
      - job: MAVEN_SonarQube
        variables:
          SONAR_SCANNER_OPTS: -Dsonar.verbose=true -Dsonar.log.level=DEBUG
          NODE_EXTRA_CA_CERTS: /jenkins_trans/tool/cert/rootca1.pem

        steps:
          - bash: |
              PARAM_GOALS="${{ parameters.sonarQubeBuildGoals }}"
              # Der hier definierte Standard-Wert muss mit dem 'default' des Parameters 'sonarQubeBuildGoals' übereinstimmen.
              DEFAULT_GOALS="verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar"
              
              if [ "$PARAM_GOALS" == "$DEFAULT_GOALS" ]; then
                echo "Parameter entspricht Default. Suche nach dynamischer Version..."
                VERSION=""
                
                # 1. Versuch: Version via Maven aus Nexus ermitteln (nutzt lokale credentials/settings.xml)
                echo "Suche aktuelle Version via Maven (dependency:get)..."
                # Wir nutzen RELEASE für die aktuellste stabile Version und :pom um den Download klein zu halten
                MVN_OUT=$(mvn dependency:get -Dartifact=org.sonarsource.scanner.maven:sonar-maven-plugin:RELEASE:pom -Dtransitive=false --batch-mode 2>/dev/null)
                
                if [ $? -eq 0 ]; then
                  NEXUS_VERSION=$(echo "$MVN_OUT" | grep "Resolved artifact" | sed -n 's/.*:\(.*\)/\1/p')
                  if [ ! -z "$NEXUS_VERSION" ]; then
                    VERSION="$NEXUS_VERSION"
                    echo "Dynamische Version via Maven ermittelt: $VERSION"
                  fi
                fi
                
                # 2. Versuch: Umgebungsvariable oder lokale Datei
                if [ -z "$VERSION" ]; then
                  if [ ! -z "$SONAR_MAVEN_PLUGIN_VERSION" ]; then
                    VERSION="$SONAR_MAVEN_PLUGIN_VERSION"
                    echo "Version aus Umgebungsvariable gefunden: $VERSION"
                  elif [ -f "/etc/sonar_plugin_version" ]; then
                    VERSION=$(cat /etc/sonar_plugin_version)
                    echo "Version aus /etc/sonar_plugin_version gefunden: $VERSION"
                  fi
                fi
                
                # Fallback: Version aus dem Parameter-Default extrahieren
                if [ -z "$VERSION" ]; then
                  VERSION=$(echo "$PARAM_GOALS" | sed -n 's/.*sonar-maven-plugin:\([^:]*\):.*/\1/p')
                  echo "Keine dynamische Version gefunden, nutze Version aus Parameter-Default: $VERSION"
                fi
                
                RESOLVED_GOALS="verify org.sonarsource.scanner.maven:sonar-maven-plugin:$VERSION:sonar"
              else
                echo "Benutzerdefinierte Goals erkannt: $PARAM_GOALS"
                RESOLVED_GOALS="$PARAM_GOALS"
              fi
              
              echo "##vso[task.setvariable variable=resolvedSonarGoals]$RESOLVED_GOALS"
            displayName: 'Dynamische Ermittlung der SonarQube Goals'

          - task: SonarQubePrepare@7
            inputs:
              SonarQube: ${{ parameters.sonarQubeServiceConnection }}
              scannerMode: 'Other'
              extraProperties: |
                sonar.projectName=$(Build.Repository.Name)

          - task: Maven@4
            displayName: SonarQubeRunAnalyze
            inputs:
              mavenPomFile: $(Build.Repository.LocalPath)${{ parameters.pomPath }}/pom.xml
              options: -Dsonar.login=$(sonarq.Prod.Token)
              mavenOptions: -Xmx1024m
              goals: $(resolvedSonarGoals)

          - task: SonarQubePublish@7
            inputs:
              pollingTimeoutSec: '600'
