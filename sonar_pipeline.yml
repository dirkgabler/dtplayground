name: SonarQube-PR-Decoration-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  branches:
    include:
      - '*'

parameters:
  - name: sonarQubeBuildGoals
    displayName: "Maven Goals zur Ausführung von Sonarqube"
    type: string
    default: 'verify org.sonarsource.scanner.maven:sonar-maven-plugin:__LATEST__:sonar'
  - name: sonarQubeServiceConnection
    displayName: "Sonarqube Service Connection (konfiguriert im Azure DevOps Projekt)"
    type: string
    default: 'SonarQubeEnterprise_PROD'
  - name: pomPath
    displayName: "Relativer Pfad der pom.xml zum Repository-Root"
    type: string
    default: '/'

pool:
  name: 'Self-hosted Linux (SEU)'

variables:
  - group: pipelines_sccm_rsc

stages:
  - stage: MAVEN_SonarQube
    jobs:
      - job: MAVEN_SonarQube
        variables:
          SONAR_SCANNER_OPTS: -Dsonar.verbose=true -Dsonar.log.level=DEBUG
          NODE_EXTRA_CA_CERTS: /jenkins_trans/tool/cert/rootca1.pem

        steps:
          - task: Maven@4
            displayName: 'Lade Sonar Maven Plugin Metadaten aus Nexus'
            continueOnError: true
            inputs:
              mavenPomFile: $(Build.Repository.LocalPath)${{ parameters.pomPath }}/pom.xml
              mavenOptions: -Xmx1024m
              goals: dependency:get
              options: >-
                -Dartifact=org.sonarsource.scanner.maven:sonar-maven-plugin:RELEASE:pom
                -Dtransitive=false
                --batch-mode
                -e

          - bash: |
              PARAM_GOALS="${{ parameters.sonarQubeBuildGoals }}"
              DEFAULT_VERSION_TOKEN="__LATEST__"
              
              if echo "$PARAM_GOALS" | grep -q "sonar-maven-plugin:${DEFAULT_VERSION_TOKEN}:sonar"; then
                echo "Parameter entspricht Default. Suche nach dynamischer Version..."
                VERSION=""
                
                # 1. Versuch: Version via Maven aus Nexus ermitteln.
                # Der vorangehende Maven-Task lädt die Metadaten mit den konfigurierten Maven-Credentials.
                echo "Suche aktuelle Version in den von Maven geladenen Metadaten..."
                META_DIR="${HOME}/.m2/repository/org/sonarsource/scanner/maven/sonar-maven-plugin"
                if [ -d "$META_DIR" ]; then
                  METADATA_FILE=$(find "$META_DIR" -maxdepth 1 \( -name 'maven-metadata-*.xml' -o -name 'maven-metadata.xml' \) | head -n 1)
                  if [ -n "$METADATA_FILE" ] && [ -f "$METADATA_FILE" ]; then
                    echo "Nutze Metadaten aus: $METADATA_FILE"
                    VERSION=$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' "$METADATA_FILE" | head -n 1)
                    if [ -z "$VERSION" ]; then
                      VERSION=$(sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' "$METADATA_FILE" | head -n 1)
                    fi
                    if [ -z "$VERSION" ]; then
                      VERSION=$(grep -o '<version>[^<]*</version>' "$METADATA_FILE" | sed 's#</\?version>##g' | sort -V | tail -n 1)
                    fi
                    if [ -n "$VERSION" ]; then
                      echo "Dynamische Version via Maven-Metadaten ermittelt: $VERSION"
                    fi
                  else
                    echo "Keine Maven-Metadaten fuer sonar-maven-plugin gefunden."
                  fi
                else
                  echo "Lokales Maven-Repository fuer sonar-maven-plugin wurde nicht angelegt."
                fi
                
                # 2. Versuch: Umgebungsvariable oder lokale Datei
                if [ -z "$VERSION" ]; then
                  if [ ! -z "$SONAR_MAVEN_PLUGIN_VERSION" ]; then
                    VERSION="$SONAR_MAVEN_PLUGIN_VERSION"
                    echo "Version aus Umgebungsvariable gefunden: $VERSION"
                  elif [ -f "/etc/sonar_plugin_version" ]; then
                    VERSION=$(cat /etc/sonar_plugin_version)
                    echo "Version aus /etc/sonar_plugin_version gefunden: $VERSION"
                  fi
                fi
                
                # Fallback: Version aus dem Parameter-Default extrahieren
                if [ -z "$VERSION" ]; then
                  VERSION=$(echo "$PARAM_GOALS" | sed -n 's/.*sonar-maven-plugin:\([^:]*\):.*/\1/p')
                  if [ "$VERSION" = "$DEFAULT_VERSION_TOKEN" ]; then
                    echo "Keine dynamische Version gefunden und kein statischer Fallback in den Goals vorhanden."
                    exit 1
                  fi
                  echo "Keine dynamische Version gefunden, nutze Version aus Parameter-Default: $VERSION"
                fi
                
                RESOLVED_GOALS="verify org.sonarsource.scanner.maven:sonar-maven-plugin:$VERSION:sonar"
              else
                echo "Benutzerdefinierte Goals erkannt: $PARAM_GOALS"
                RESOLVED_GOALS="$PARAM_GOALS"
              fi
              
              echo "##vso[task.setvariable variable=resolvedSonarGoals]$RESOLVED_GOALS"
            displayName: 'Dynamische Ermittlung der SonarQube Goals'

          - task: SonarQubePrepare@7
            inputs:
              SonarQube: ${{ parameters.sonarQubeServiceConnection }}
              scannerMode: 'Other'
              extraProperties: |
                sonar.projectName=$(Build.Repository.Name)

          - task: Maven@4
            displayName: SonarQubeRunAnalyze
            inputs:
              mavenPomFile: $(Build.Repository.LocalPath)${{ parameters.pomPath }}/pom.xml
              options: -Dsonar.login=$(sonarq.Prod.Token)
              mavenOptions: -Xmx1024m
              goals: $(resolvedSonarGoals)

          - task: SonarQubePublish@7
            inputs:
              pollingTimeoutSec: '600'
