name: SonarQube-PR-Decoration-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  branches:
    include:
      - '*'

parameters:
  - name: sonarQubeBuildGoals
    displayName: "Maven Goals zur Ausführung von Sonarqube"
    type: string
    default: 'verify org.sonarsource.scanner.maven:sonar-maven-plugin:__SONAR_PLUGIN_VERSION__:sonar'
  - name: sonarQubeServiceConnection
    displayName: "Sonarqube Service Connection (konfiguriert im Azure DevOps Projekt)"
    type: string
    default: 'SonarQubeEnterprise_PROD'
  - name: pomPath
    displayName: "Relativer Pfad der pom.xml zum Repository-Root"
    type: string
    default: '/'

pool:
  name: 'Self-hosted Linux (SEU)'

variables:
  - group: pipelines_sccm_rsc
  - group: variables_sccm
  - name: sonarPluginVersionFallback
    value: '5.5.0.6356'
  - name: resolvedSonarPluginVersion
    value: $[ coalesce(variables['SONAR_PLUGIN_VERSION'], variables['sonarPluginVersionFallback']) ]

stages:
  - stage: MAVEN_SonarQube
    jobs:
      - job: MAVEN_SonarQube
        variables:
          SONAR_SCANNER_OPTS: -Dsonar.verbose=true -Dsonar.log.level=DEBUG
          NODE_EXTRA_CA_CERTS: /jenkins_trans/tool/cert/rootca1.pem

        steps:
          - bash: |
              PARAM_GOALS="$PARAM_GOALS_RAW"
              GOALS_VERSION_PLACEHOLDER='__SONAR_PLUGIN_VERSION__'
              RESOLVED_PLUGIN_VERSION="$RESOLVED_PLUGIN_VERSION_RAW"
              
              if [ -z "$RESOLVED_PLUGIN_VERSION" ]; then
                echo "Es konnte keine Sonar-Plugin-Version aufgeloest werden."
                exit 1
              fi

              echo "Verwende Sonar-Plugin-Version: $RESOLVED_PLUGIN_VERSION"

              if echo "$PARAM_GOALS" | grep -Fq "sonar-maven-plugin:${GOALS_VERSION_PLACEHOLDER}:sonar"; then
                echo "Goals enthalten den SONAR_PLUGIN_VERSION-Platzhalter. Ersetze ihn durch die aufgeloeste Version..."
                RESOLVED_GOALS="${PARAM_GOALS//$GOALS_VERSION_PLACEHOLDER/$RESOLVED_PLUGIN_VERSION}"
              else
                echo "Benutzerdefinierte Goals erkannt: $PARAM_GOALS"
                RESOLVED_GOALS="$PARAM_GOALS"
              fi
              
              echo "Aufgeloeste Maven Goals: $RESOLVED_GOALS"
              echo "##vso[task.setvariable variable=resolvedSonarGoals]$RESOLVED_GOALS"
            displayName: 'Dynamische Ermittlung der SonarQube Goals'
            env:
              PARAM_GOALS_RAW: ${{ parameters.sonarQubeBuildGoals }}
              RESOLVED_PLUGIN_VERSION_RAW: $(resolvedSonarPluginVersion)

          - task: SonarQubePrepare@7
            inputs:
              SonarQube: ${{ parameters.sonarQubeServiceConnection }}
              scannerMode: 'Other'
              extraProperties: |
                sonar.projectName=$(Build.Repository.Name)

          - task: Maven@4
            displayName: SonarQubeRunAnalyze
            inputs:
              mavenPomFile: $(Build.Repository.LocalPath)${{ parameters.pomPath }}/pom.xml
              options: -Dsonar.login=$(sonarq.Prod.Token)
              mavenOptions: -Xmx1024m
              goals: $(resolvedSonarGoals)

          - task: SonarQubePublish@7
            inputs:
              pollingTimeoutSec: '600'
