name: SonarQube-PR-Decoration-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  branches:
    include:
      - '*'

parameters:
  - name: sonarQubeBuildGoals
    displayName: "Maven Goals zur Ausfuehrung von SonarQube"
    type: string
    default: 'verify org.sonarsource.scanner.maven:sonar-maven-plugin:__SONAR_PLUGIN_VERSION__:sonar'

  - name: sonarQubeServiceConnection
    displayName: "SonarQube Service Connection (konfiguriert im Azure DevOps Projekt)"
    type: string
    default: 'SonarQubeEnterprise_PROD'

  - name: pomPath
    displayName: "Relativer Pfad der pom.xml zum Repository-Root"
    type: string
    default: '.'

  - name: variableGroups
    displayName: "Variable Groups mit SonarQube Token und optionaler Plugin-Version"
    type: object
    default:
      - pipelines_sccm_rsc
      - variables_sccm

  - name: agentPoolName
    displayName: "Agent Pool"
    type: string
    default: 'Self-hosted Linux (SEU)'

  - name: poolRequirements
    displayName: "Agent Demands"
    type: object
    default: []

  - name: sonarProjectName
    displayName: "SonarQube Projektname"
    type: string
    default: '$(Build.Repository.Name)'

  - name: sonarExtraProperties
    displayName: "Zusaetzliche SonarQube Properties"
    type: string
    default: ''

  - name: mavenOptions
    displayName: "Maven JVM Optionen"
    type: string
    default: '-Xmx1024m'

  - name: mavenTaskOptions
    displayName: "Maven Task Optionen"
    type: string
    default: '-Dsonar.login=$(sonarq.Prod.Token)'

  - name: sonarScannerOpts
    displayName: "Sonar Scanner Optionen"
    type: string
    default: '-Dsonar.verbose=true -Dsonar.log.level=DEBUG'

  - name: nodeExtraCaCerts
    displayName: "Pfad zur zusaetzlichen CA-Zertifikatsdatei"
    type: string
    default: '/jenkins_trans/tool/cert/rootca1.pem'

  - name: publishQualityGate
    displayName: "SonarQube Quality Gate veroeffentlichen"
    type: boolean
    default: true

  - name: pollingTimeoutSec
    displayName: "Timeout fuer Quality-Gate-Polling in Sekunden"
    type: string
    default: '600'

  - name: timeoutInMinutes
    displayName: "Maximale Job-Laufzeit in Minuten"
    type: number
    default: 60

stages:
  - stage: MAVEN_SonarQube
    displayName: Maven SonarQube
    jobs:
      - template: jobs/templates/jobsMavenSonarQube.yml
        parameters:
          sonarQubeBuildGoals: ${{ parameters.sonarQubeBuildGoals }}
          sonarQubeServiceConnection: ${{ parameters.sonarQubeServiceConnection }}
          pomPath: ${{ parameters.pomPath }}
          variableGroups: ${{ parameters.variableGroups }}
          agentPoolName: ${{ parameters.agentPoolName }}
          poolRequirements: ${{ parameters.poolRequirements }}
          sonarProjectName: ${{ parameters.sonarProjectName }}
          sonarExtraProperties: ${{ parameters.sonarExtraProperties }}
          mavenOptions: ${{ parameters.mavenOptions }}
          mavenTaskOptions: ${{ parameters.mavenTaskOptions }}
          sonarScannerOpts: ${{ parameters.sonarScannerOpts }}
          nodeExtraCaCerts: ${{ parameters.nodeExtraCaCerts }}
          publishQualityGate: ${{ parameters.publishQualityGate }}
          pollingTimeoutSec: ${{ parameters.pollingTimeoutSec }}
          timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
