parameters:
  - name: jobName
    type: string
    default: MAVEN_SonarQube

  - name: displayName
    type: string
    default: Maven SonarQube Analyse

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: succeeded()

  - name: agentPoolName
    type: string
    default: 'Self-hosted Linux (SEU)'

  - name: poolRequirements
    type: object
    default: []

  - name: variableGroups
    type: object
    default:
      - pipelines_sccm_rsc
      - variables_sccm

  - name: sonarQubeBuildGoals
    type: string
    default: 'verify org.sonarsource.scanner.maven:sonar-maven-plugin:__SONAR_PLUGIN_VERSION__:sonar'

  - name: sonarQubeServiceConnection
    type: string
    default: 'SonarQubeEnterprise_PROD'

  - name: pomPath
    type: string
    default: '.'

  - name: sonarProjectName
    type: string
    default: '$(Build.Repository.Name)'

  - name: sonarExtraProperties
    type: string
    default: ''

  - name: mavenOptions
    type: string
    default: '-Xmx1024m'

  - name: mavenTaskOptions
    type: string
    default: '-Dsonar.login=$(sonarq.Prod.Token)'

  - name: sonarScannerOpts
    type: string
    # Wird als Umgebungsvariable SONAR_SCANNER_OPTS gesetzt und vom SonarQube Scanner
    # automatisch als JVM-Argumente ausgewertet. Ermöglicht z. B. verbose Logging.
    default: '-Dsonar.verbose=true -Dsonar.log.level=INFO'

  - name: nodeExtraCaCerts
    type: string
    default: '/jenkins_trans/tool/cert/rootca1.pem'

  - name: checkoutSubmodules
    type: boolean
    default: false

  - name: checkoutPersistCredentials
    type: boolean
    default: false

  - name: checkoutClean
    type: boolean
    default: true

  - name: publishQualityGate
    type: boolean
    default: true

  - name: pollingTimeoutSec
    type: string
    default: '600'

  - name: timeoutInMinutes
    type: number
    default: 60

  - name: preSteps
    type: stepList
    default: []

  - name: postSteps
    type: stepList
    default: []

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      name: ${{ parameters.agentPoolName }}
      ${{ if ne(length(parameters.poolRequirements), 0) }}:
        demands:
          - ${{ each poolRequirement in parameters.poolRequirements }}:
              - ${{ poolRequirement }}
    variables:
      - ${{ each variableGroup in parameters.variableGroups }}:
          - group: ${{ variableGroup }}
      - name: SONAR_SCANNER_OPTS
        value: ${{ parameters.sonarScannerOpts }}
      - name: NODE_EXTRA_CA_CERTS
        value: ${{ parameters.nodeExtraCaCerts }}
    steps:
      - checkout: self
        submodules: ${{ parameters.checkoutSubmodules }}
        persistCredentials: ${{ parameters.checkoutPersistCredentials }}
        clean: ${{ parameters.checkoutClean }}
        displayName: Repository auschecken

      - ${{ parameters.preSteps }}

      - bash: |
          set -euo pipefail

          NORMALIZED_PATH=''

          normalize_relative_path() {
            local raw_path="$1"

            # Backslashes zu Forward-Slashes konvertieren; "/" als "." behandeln
            local path="${raw_path//\\//}"
            [[ "${path}" == "/" ]] && path="."

            # Absolute Pfade ablehnen
            if [[ "${path}" == /* ]]; then
              echo "##vso[task.logissue type=error]pomPath muss relativ zum Repository sein. Absolute Pfade wie '${raw_path}' sind nicht erlaubt."
              exit 1
            fi

            # Führende "./" und eingebettete "/./" entfernen
            while [[ "${path}" == ./* ]]; do path="${path#./}"; done
            while [[ "${path}" == *"/./"* ]]; do path="${path//\/\.\//\/}"; done

            # Doppelte und abschließende Slashes bereinigen
            path="$(printf '%s' "${path}" | sed -E 's#/+#/#g; s#/$##; s#/\.$##')"

            [[ -z "${path}" || "${path}" == "." ]] && { NORMALIZED_PATH='.'; return 0; }

            # Einzelne Pfadsegmente auf unzulässige Werte prüfen
            IFS='/' read -r -a path_segments <<< "${path}"
            for path_segment in "${path_segments[@]}"; do
              if [[ -z "${path_segment}" || "${path_segment}" == "." || "${path_segment}" == ".." ]]; then
                echo "##vso[task.logissue type=error]pomPath '${raw_path}' ist ungueltig. Pfadsegmente '.', '..' oder leere Segmente werden nicht unterstuetzt."
                exit 1
              fi
            done

            NORMALIZED_PATH="${path}"
          }

          normalize_relative_path "${POM_PATH_RAW}"
          POM_RELATIVE_PATH="${NORMALIZED_PATH}"

          if [[ "${POM_RELATIVE_PATH}" == "." ]]; then
            POM_FILE="$(Build.Repository.LocalPath)/pom.xml"
          else
            POM_FILE="$(Build.Repository.LocalPath)/${POM_RELATIVE_PATH}/pom.xml"
          fi

          if [[ ! -f "${POM_FILE}" ]]; then
            echo "##vso[task.logissue type=error]pom.xml wurde unter '${POM_FILE}' nicht gefunden."
            exit 1
          fi

          echo "Verwende pom.xml: ${POM_FILE}"
          echo "##vso[task.setvariable variable=sonarPomFile]${POM_FILE}"
        displayName: 'Eingaben validieren und normalisieren'
        env:
          POM_PATH_RAW: ${{ parameters.pomPath }}

      - bash: |
          set -euo pipefail

          readonly GOALS_VERSION_PLACEHOLDER='__SONAR_PLUGIN_VERSION__'

          if [ -z "$SONAR_PLUGIN_VERSION" ]; then
            echo "##vso[task.logissue type=error]Die Variable SONAR_PLUGIN_VERSION ist nicht gesetzt. Pipeline wird abgebrochen."
            exit 1
          fi

          echo "Verwende Sonar-Plugin-Version: $SONAR_PLUGIN_VERSION"

          # Standard: Goals unveraendert uebernehmen
          RESOLVED_GOALS="$PARAM_GOALS_RAW"

          if [[ "$PARAM_GOALS_RAW" == *"sonar-maven-plugin:${GOALS_VERSION_PLACEHOLDER}:sonar"* ]]; then
            echo "Goals enthalten den SONAR_PLUGIN_VERSION-Platzhalter. Ersetze ihn durch die aufgeloeste Version..."
            RESOLVED_GOALS="${PARAM_GOALS_RAW//$GOALS_VERSION_PLACEHOLDER/$SONAR_PLUGIN_VERSION}"
          else
            echo "Benutzerdefinierte Goals erkannt: $PARAM_GOALS_RAW"
          fi

          echo "Aufgeloeste Maven Goals: $RESOLVED_GOALS"
          echo "##vso[task.setvariable variable=resolvedSonarGoals]$RESOLVED_GOALS"
        displayName: 'SonarQube Goals ermitteln'
        env:
          PARAM_GOALS_RAW: ${{ parameters.sonarQubeBuildGoals }}
          SONAR_PLUGIN_VERSION: $(sonar.plugin.version)

      - task: SonarQubePrepare@7
        inputs:
          SonarQube: ${{ parameters.sonarQubeServiceConnection }}
          scannerMode: 'Other'
          extraProperties: |
            sonar.projectName=${{ parameters.sonarProjectName }}
            ${{ parameters.sonarExtraProperties }}

      - task: Maven@4
        displayName: SonarQube Analyse ausfuehren
        inputs:
          mavenPomFile: $(sonarPomFile)
          options: ${{ parameters.mavenTaskOptions }}
          mavenOptions: ${{ parameters.mavenOptions }}
          goals: $(resolvedSonarGoals)

      - ${{ if eq(parameters.publishQualityGate, true) }}:
          - task: SonarQubePublish@7
            inputs:
              pollingTimeoutSec: ${{ parameters.pollingTimeoutSec }}

      - ${{ parameters.postSteps }}
