parameters:
  - name: npmBuildCmd
    type: object
    default: []

  - name: buildCommands
    type: object
    default: []

  - name: npmUserConfig
    type: string

  - name: artifactPath
    type: object

  - name: publishBuildArtifacts
    type: boolean

  - name: retentionDays
    type: number
    default: 0

  - name: publishTag
    type: string
    default: ''

  - name: publishRegistry
    type: string
    default: ''

  - name: publishNpm
    type: boolean
    default: true

  - name: tagRelease
    type: boolean
    default: false

  - name: gitTagTemplate
    type: string
    default: '$(releaseNumber)'

steps:
  - task: Bash@3
    displayName: "npm ci"
    env:
      NPM_CONFIG_USERCONFIG: ${{ parameters.npmUserConfig }}
    inputs:
      targetType: 'inline'
      workingDirectory: $(workspaceWorkingPath)
      script: |
        set -euo pipefail
        npm ci

  - task: Bash@3
    displayName: "NPM set pre-release version"
    condition: and(succeeded(), eq(coalesce(variables['isPreRelease'], 'false'), 'true'))
    env:
      NPM_CONFIG_USERCONFIG: ${{ parameters.npmUserConfig }}
    inputs:
      targetType: 'inline'
      workingDirectory: $(packageWorkingPath)
      script: |
        set -euo pipefail
        npm version "$(releaseNumber).$(branchRunCounter)" --no-git-tag-version --ignore-scripts

  - ${{ each buildCmd in parameters.npmBuildCmd }}:
      - task: Bash@3
        displayName: "NPM Command '${{ buildCmd }}'"
        env:
          NPM_CONFIG_USERCONFIG: ${{ parameters.npmUserConfig }}
        inputs:
          targetType: 'inline'
          workingDirectory: $(workspaceWorkingPath)
          script: |
            set -euo pipefail
            npm ${{ buildCmd }}

  - ${{ each buildCmd in parameters.buildCommands }}:
      - task: Bash@3
        displayName: "Build-Kommando '${{ buildCmd }}'"
        env:
          NPM_CONFIG_USERCONFIG: ${{ parameters.npmUserConfig }}
        inputs:
          targetType: 'inline'
          workingDirectory: $(workspaceWorkingPath)
          script: |
            set -euo pipefail
            ${{ buildCmd }}

  - ${{ if eq(parameters.publishNpm, true) }}:
      - task: Bash@3
        displayName: "NPM Publish"
        condition: succeeded()
        env:
          NPM_CONFIG_USERCONFIG: ${{ parameters.npmUserConfig }}
        inputs:
          targetType: 'inline'
          workingDirectory: $(publishWorkingPath)
          verbose: true
          script: |
            set -euo pipefail

            PACKAGE_SCOPE="$(packageScope)"
            PUBLISH_REGISTRY="${{ parameters.publishRegistry }}"

            if [[ -z "${PACKAGE_SCOPE}" ]]; then
              echo "##vso[task.logissue type=error]packageScope ist leer. Der Scoped Package Name aus der Vorbereitung fehlt."
              exit 1
            fi

            if [[ -z "${PUBLISH_REGISTRY}" ]]; then
              echo "##vso[task.logissue type=error]publishRegistry ist leer. npm publish kann nicht ausgefuehrt werden."
              exit 1
            fi

            if [[ ! -d "$(publishWorkingPath)" ]]; then
              echo "##vso[task.logissue type=error]publishPath '$(publishWorkingPath)' wurde nicht gefunden. Stelle sicher, dass der Build das Publish-Verzeichnis erzeugt."
              exit 1
            fi

            if [[ ! -f package.json ]]; then
              echo "##vso[task.logissue type=error]Im Publish-Verzeichnis '$(publishWorkingPath)' wurde keine package.json gefunden."
              exit 1
            fi

            npm publish \
              --tag="${{ parameters.publishTag }}" \
              --registry="${PUBLISH_REGISTRY}" \
              "--${PACKAGE_SCOPE}:registry=${PUBLISH_REGISTRY}"

  - ${{ if and(eq(parameters.publishNpm, true), eq(parameters.tagRelease, true)) }}:
      - task: Bash@3
        displayName: "Git-Release-Tag pushen"
        condition: succeeded()
        env:
          BUILD_REQUESTEDFOR: $(Build.RequestedFor)
          BUILD_REQUESTEDFOREMAIL: $(Build.RequestedForEmail)
        inputs:
          targetType: 'inline'
          workingDirectory: $(workspaceWorkingPath)
          script: |
            set -euo pipefail

            TAG_NAME="${{ parameters.gitTagTemplate }}"
            CURRENT_COMMIT="$(git rev-parse HEAD)"
            TAG_USER="${BUILD_REQUESTEDFOR}"
            TAG_MAIL="${BUILD_REQUESTEDFOREMAIL}"

            if [[ -z "${TAG_NAME}" ]]; then
              echo "##vso[task.logissue type=error]gitTagTemplate hat einen leeren Tag-Namen ergeben."
              exit 1
            fi

            if [[ -z "${TAG_USER}" || -z "${TAG_MAIL}" ]]; then
              echo "##vso[task.logissue type=error]Build.RequestedFor oder Build.RequestedForEmail ist leer. Git-Tag kann nicht mit dem ausloesenden Benutzer erstellt werden."
              exit 1
            fi

            echo "Verwende Release-Tag '${TAG_NAME}' fuer Commit '${CURRENT_COMMIT}'."
            echo "Tag-Autor: '${TAG_USER}' <${TAG_MAIL}>"

            git config --local user.name "${TAG_USER}"
            git config --local user.email "${TAG_MAIL}"

            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              git tag -d "${TAG_NAME}"
            fi

            git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" || true

            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              TAG_COMMIT="$(git rev-list -n 1 "${TAG_NAME}")"

              if [[ "${TAG_COMMIT}" != "${CURRENT_COMMIT}" ]]; then
                echo "##vso[task.logissue type=error]Git-Tag '${TAG_NAME}' existiert bereits auf Commit '${TAG_COMMIT}', aktueller Commit ist '${CURRENT_COMMIT}'."
                exit 1
              fi

              echo "Git-Tag '${TAG_NAME}' existiert bereits auf dem aktuellen Commit. Kein Push erforderlich."
              exit 0
            fi

            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "refs/tags/${TAG_NAME}"

  - ${{ if eq(parameters.publishBuildArtifacts, true) }}:
      - ${{ each artifactPath in parameters.artifactPath }}:
          - task: Bash@3
            displayName: "Artefaktname für '${{ artifactPath }}' ableiten"
            inputs:
              targetType: 'inline'
              workingDirectory: $(workspaceWorkingPath)
              script: |
                set -euo pipefail
                ARTIFACT_PATH="${{ artifactPath }}"
                ARTIFACT_NAME="$(printf '%s' "${ARTIFACT_PATH}" | sed -E 's#^[./]+##; s#[/\\]+$##; s#[/\\]+#-#g')"

                if [ -z "${ARTIFACT_NAME}" ]; then
                  echo "##vso[task.logissue type=error]Aus artifactPath '${ARTIFACT_PATH}' konnte kein gueltiger Artefaktname abgeleitet werden."
                  exit 1
                fi

                echo "Verwende Artefaktnamen '${ARTIFACT_NAME}' fuer Pfad '${ARTIFACT_PATH}'."
                echo "##vso[task.setvariable variable=artifactName]${ARTIFACT_NAME}"
          - task: PublishPipelineArtifact@1
            displayName: "Artefakt '${{ artifactPath }}' publizieren"
            inputs:
              targetPath: $(workspaceWorkingPath)/${{ artifactPath }}
              artifactName: $(artifactName)

  - ${{ if ne(parameters.retentionDays, 0) }}:
      - task: Bash@3
        displayName: "Retention-Lease setzen"
        condition: and(succeeded(), not(canceled()))
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
          SYSTEM_DEFINITIONID: $(System.DefinitionId)
          BUILD_BUILDID: $(Build.BuildId)
        inputs:
          targetType: 'inline'
          workingDirectory: $(workspaceWorkingPath)
          script: |
            set -euo pipefail

            if [[ -z "${SYSTEM_ACCESSTOKEN:-}" ]]; then
              echo "##vso[task.logissue type=error]System.AccessToken ist leer. Stelle sicher, dass das Pipeline-Token fuer Skripte verfuegbar ist."
              exit 1
            fi

            if [[ -z "${SYSTEM_COLLECTIONURI:-}" || -z "${SYSTEM_TEAMPROJECTID:-}" || -z "${SYSTEM_DEFINITIONID:-}" || -z "${BUILD_BUILDID:-}" ]]; then
              echo "##vso[task.logissue type=error]Erforderliche Azure-DevOps-Kontextvariablen fehlen. Erwartet: System.CollectionUri, System.TeamProjectId, System.DefinitionId, Build.BuildId."
              exit 1
            fi

            REQUEST_BODY="$(printf '[{"daysValid":%s,"definitionId":%s,"ownerId":"NpmBuildAndVersionJobTmpl","protectPipeline":false,"runId":%s}]' \
              "${{ parameters.retentionDays }}" \
              "${SYSTEM_DEFINITIONID}" \
              "${BUILD_BUILDID}")"

            API_URL="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/retention/leases?api-version=7.1"

            RESPONSE="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
              --header "Content-Type: application/json" \
              --data "${REQUEST_BODY}" \
              "${API_URL}")"

            LEASE_ID="$(printf '%s' "${RESPONSE}" | node -e "const payload = JSON.parse(require('fs').readFileSync(0, 'utf8')); const leases = Array.isArray(payload) ? payload : Array.isArray(payload.value) ? payload.value : []; process.stdout.write(String(leases[0]?.leaseId || ''))")"
            VALID_UNTIL="$(printf '%s' "${RESPONSE}" | node -e "const payload = JSON.parse(require('fs').readFileSync(0, 'utf8')); const leases = Array.isArray(payload) ? payload : Array.isArray(payload.value) ? payload.value : []; process.stdout.write(String(leases[0]?.validUntil || ''))")"

            if [[ -z "${LEASE_ID}" ]]; then
              echo "##vso[task.logissue type=error]Azure DevOps hat keine Lease-ID fuer den Pipeline-Lauf zurueckgegeben."
              exit 1
            fi

            echo "Retention-Lease ${LEASE_ID} fuer ${BUILD_BUILDID} gesetzt (${VALID_UNTIL})."
