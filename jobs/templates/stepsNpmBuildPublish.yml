parameters:
  - name: projectPath
    type: string

  - name: npmBuildCmd
    type: object

  - name: npmUserConfig
    type: string

  - name: artifactPath
    type: object

  - name: publishBuildArtifacts
    type: boolean

  - name: retention
    type: boolean
    default: false

  - name: publishTag
    type: string
    default: ''

  - name: publishRegistry
    type: string
    default: ''

  - name: publishNpm
    type: boolean
    default: true

  - name: tagRelease
    type: boolean
    default: false


steps:
  - task: Bash@3
    displayName: Git-Tags bereinigen und aktualisieren
    inputs:
      targetType: 'inline'
      workingDirectory: $(Build.Repository.LocalPath)${{ parameters.projectPath }}
      script: |
        set -euo pipefail
        git tag -l | xargs -r git tag -d
        git fetch --tags --force origin

  - task: Npm@1
    displayName: "npm ci"
    inputs:
      command: custom
      customCommand: ci --userconfig=${{ parameters.npmUserConfig }}
      workingDir: $(Build.Repository.LocalPath)${{ parameters.projectPath }}

  - task: Npm@1
    displayName: NPM set pre-release version
    condition: and(succeeded(), eq(coalesce(variables['isPreRelease'], 'false'), 'true'))
    inputs:
      command: custom
      customCommand: version $(releaseNumber).$(branchRunCounter) --no-git-tag-version --userconfig=${{ parameters.npmUserConfig }}
      workingDir: $(Build.Repository.LocalPath)${{ parameters.projectPath }}

  - ${{ each buildCmd in parameters.npmBuildCmd }}:
      - task: Npm@1
        displayName: NPM Command '${{ buildCmd }}'
        inputs:
          command: custom
          customCommand: ${{ buildCmd }} --userconfig=${{ parameters.npmUserConfig }}
          workingDir: $(Build.Repository.LocalPath)${{ parameters.projectPath }}
          verbose: true

  - ${{ if eq(parameters.publishNpm, true) }}:
      - task: Bash@3
        displayName: "NPM Publish"
        condition: succeeded()
        inputs:
          targetType: 'inline'
          workingDirectory: $(Build.Repository.LocalPath)${{ parameters.projectPath }}
          verbose: true
          script: |
            npm publish --tag="${{ parameters.publishTag }}" --registry="${{ parameters.publishRegistry }}" --userconfig="${{ parameters.npmUserConfig }}"

  - ${{ if and(eq(parameters.publishNpm, true), eq(parameters.tagRelease, true)) }}:
      - task: Bash@3
        displayName: "Git-Release-Tag pushen"
        condition: succeeded()
        env:
          BUILD_REQUESTEDFOR: $(Build.RequestedFor)
          BUILD_REQUESTEDFOREMAIL: $(Build.RequestedForEmail)
        inputs:
          targetType: 'inline'
          workingDirectory: $(Build.Repository.LocalPath)${{ parameters.projectPath }}
          script: |
            set -euo pipefail

            TAG_NAME="$(node -p "require('./package.json').version")"
            CURRENT_COMMIT="$(git rev-parse HEAD)"
            TAG_USER="${BUILD_REQUESTEDFOR}"
            TAG_MAIL="${BUILD_REQUESTEDFOREMAIL}"

            echo "Verwende Release-Tag '${TAG_NAME}' fuer Commit '${CURRENT_COMMIT}'."
            echo "Tag-Autor: '${TAG_USER}' <${TAG_MAIL}>"

            if [[ -z "${TAG_USER}" || -z "${TAG_MAIL}" ]]; then
              echo "##vso[task.logissue type=error]Build.RequestedFor oder Build.RequestedForEmail ist leer. Git-Tag kann nicht mit dem ausloesenden Benutzer erstellt werden."
              exit 1
            fi

            git config user.name "${TAG_USER}"
            git config user.email "${TAG_MAIL}"

            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              TAG_COMMIT="$(git rev-list -n 1 "${TAG_NAME}")"

              if [[ "${TAG_COMMIT}" != "${CURRENT_COMMIT}" ]]; then
                echo "##vso[task.logissue type=error]Git-Tag '${TAG_NAME}' existiert bereits auf Commit '${TAG_COMMIT}', aktueller Commit ist '${CURRENT_COMMIT}'."
                exit 1
              fi

              echo "Git-Tag '${TAG_NAME}' existiert bereits auf dem aktuellen Commit. Kein Push erforderlich."
              exit 0
            fi

            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "refs/tags/${TAG_NAME}"

  - ${{ if eq(parameters.publishBuildArtifacts, true) }}:
      - ${{ each artifactPath in parameters.artifactPath }}:
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.Repository.LocalPath)/${{ parameters.projectPath }}/${{ artifactPath }}
              artifactName: ${{ artifactPath }}

  - ${{ if eq(parameters.retention, true) }}:
      - task: Retention@1
        displayName: Save pipeline run
        inputs:
          months: 12
          retainbuilds: true
