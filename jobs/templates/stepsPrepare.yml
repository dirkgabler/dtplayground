parameters:
  - name: projectPath
    type: string
  - name: npmUserConfig
    type: string

steps:
  - checkout: self
    submodules: true
    persistCredentials: true
    clean: true
    displayName: Repository auschecken

  - bash: |
      set -euo pipefail

      RAW_PATH="${{ parameters.projectPath }}"

      if [[ "${RAW_PATH}" == /* ]]; then
        echo "##vso[task.logissue type=error]projectPath muss relativ zum Repository sein. Absolute Pfade wie '${RAW_PATH}' sind nicht erlaubt."
        exit 1
      fi

      # projectPath bereinigen (führende/folgende Slashes und Punkte)
      CLEAN_PATH=$(echo "${RAW_PATH}" | sed -E 's/^\.\/|\/$|\/\.$//g')

      if [[ -z "${CLEAN_PATH}" || "${CLEAN_PATH}" == "." ]]; then
        PROJECT_WORKING_PATH="$(Build.SourcesDirectory)"
        NORMALIZED_RELATIVE_PATH="."
      else
        PROJECT_WORKING_PATH="$(Build.SourcesDirectory)/${CLEAN_PATH}"
        NORMALIZED_RELATIVE_PATH="${CLEAN_PATH}"
      fi

      if [[ ! -d "${PROJECT_WORKING_PATH}" ]]; then
        echo "##vso[task.logissue type=error]Projektverzeichnis '${PROJECT_WORKING_PATH}' wurde nicht gefunden."
        exit 1
      fi

      echo "Verwende projectPath '${NORMALIZED_RELATIVE_PATH}' (${PROJECT_WORKING_PATH})."
      echo "##vso[task.setvariable variable=projectPathNormalized]${NORMALIZED_RELATIVE_PATH}"
      echo "##vso[task.setvariable variable=projectWorkingPath]${PROJECT_WORKING_PATH}"
    displayName: "Normalisiere projectPath"

  - bash: |
      set -euo pipefail
      for f in package.json package-lock.json; do
        if [ -f "$f" ]; then
          echo "$f found -> continue"
        else
          echo "##vso[task.logissue type=error]$f erforderlich aber nicht gefunden"
          exit 1
        fi
      done
    displayName: "Prüfe package.json und package-lock.json"
    workingDirectory: $(projectWorkingPath)

  - bash: |
      set -euo pipefail
      node <<'NODE'
      const pkg = require('./package.json');
      const scripts =
        typeof pkg?.scripts === 'object' && pkg.scripts !== null ? pkg.scripts : {};
      const blockedScripts = ['preversion', 'version', 'postversion'].filter((name) =>
        Object.prototype.hasOwnProperty.call(scripts, name)
      );

      if (blockedScripts.length > 0) {
        console.error(
          `##vso[task.logissue type=error]package.json enthaelt nicht unterstuetzte npm Lifecycle-Skripte (${blockedScripts.join(', ')}). Das Template fuehrt 'npm version' mit deaktivierten Scripts aus. Konsumenten-Pipelines muessen die betroffene Logik gegebenenfalls in explizite Pipeline-Schritte oder npmBuildCmd migrieren.`
        );
        process.exit(1);
      }

      console.log('Keine blockierten npm Lifecycle-Skripte fuer npm version gefunden.');
      NODE
    displayName: "Prüfe blockierte npm version-Skripte"
    workingDirectory: $(projectWorkingPath)

  - bash: |
      set -euo pipefail
      node <<'NODE'
      const pkg = require('./package.json');
      const packageName = typeof pkg.name === 'string' ? pkg.name.trim() : '';
      const allowedScopes = ['bshweb', 'diamant', 'dida', 'idefx', 'kbn', 'shg'];

      if (!packageName) {
        console.error("##vso[task.logissue type=error]package.json muss ein nicht-leeres Feld 'name' enthalten.");
        process.exit(1);
      }

      const scopedNameMatch = packageName.match(/^@([^/]+)\/[^/]+$/);
      if (!scopedNameMatch) {
        console.error(`##vso[task.logissue type=error]package.json.name '${packageName}' ist ungueltig. Erwartet wird ein Scoped Package Name im Format '@scope/name'.`);
        process.exit(1);
      }

      const packageScopeName = scopedNameMatch[1];
      if (!allowedScopes.includes(packageScopeName)) {
        console.error(`##vso[task.logissue type=error]Der Scope '${packageScopeName}' aus package.json.name '${packageName}' ist nicht erlaubt. Erlaubte Scopes: ${allowedScopes.join(', ')}.`);
        process.exit(1);
      }

      const packageScope = `@${packageScopeName}`;
      console.log(`Verwende Paketnamen '${packageName}' mit Scope '${packageScope}'.`);
      console.log(`##vso[task.setvariable variable=packageName]${packageName}`);
      console.log(`##vso[task.setvariable variable=packageScope]${packageScope}`);
      NODE
    displayName: "Prüfe Scoped Package Name und erlaubte Scopes"
    workingDirectory: $(projectWorkingPath)

  - bash: |
      set -euo pipefail
      node <<'NODE'
      const pkg = require('./package.json');
      const version = typeof pkg.version === 'string' ? pkg.version.trim() : '';
      const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;

      if (!version) {
        console.error("##vso[task.logissue type=error]package.json muss ein nicht-leeres Feld 'version' enthalten.");
        process.exit(1);
      }

      if (!semverPattern.test(version)) {
        console.error(`##vso[task.logissue type=error]package.json.version '${version}' ist ungueltig. Erwartet wird SemVer mit numerischem major.minor.patch, z. B. '1.2.3' oder '1.2.3-snapshot'.`);
        process.exit(1);
      }

      console.log(`Verwende gueltige SemVer-Version '${version}'.`);
      NODE
    displayName: "Prüfe SemVer-Version"
    workingDirectory: $(projectWorkingPath)

  - bash: |
      set -euo pipefail
      export VERSION=$(node -p "require('./package.json').version")
      MAJOR_MINOR="$(echo "$VERSION" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1.\2/')"
      echo "##vso[task.setvariable variable=majorMinor]$MAJOR_MINOR"

      # Liest den optionalen Pre-Release-Teil direkt aus einer SemVer-Version wie
      # 1.2.3-snapshot oder 1.2.3-release.1 und verwendet das erste Segment als Label.
      PRERELEASE_PART="$(node -e "const version = process.env.VERSION || ''; const match = version.match(/^[0-9]+\.[0-9]+\.[0-9]+-([^+]+)(?:\+.*)?$/); process.stdout.write(match ? match[1] : '');")"
      if [ -n "$PRERELEASE_PART" ]; then
        echo "##vso[task.setvariable variable=isPreRelease]true"
        VERSION_LABEL="${PRERELEASE_PART%%.*}"
        echo "##vso[task.setvariable variable=versionLabel]$VERSION_LABEL"
      else
        echo "##vso[task.setvariable variable=isPreRelease]false"
        echo "##vso[task.setvariable variable=versionLabel]"
      fi

      echo "##vso[task.setvariable variable=releaseNumber]$VERSION"
    displayName: "Ermittle Versionsnummer und Version-Label"
    workingDirectory: $(projectWorkingPath)
