parameters:
  - name: projectPath
    type: string
  - name: npmUserConfig
    type: string

steps:
  - checkout: self
    submodules: true
    persistCredentials: true
    clean: true
    displayName: Repository auschecken

  - bash: |
      set -euo pipefail
      for f in package.json package-lock.json; do
        if [ -f "$f" ]; then
          echo "$f found -> continue"
        else
          echo "##vso[task.logissue type=error]$f erforderlich aber nicht gefunden"
          exit 1
        fi
      done
    displayName: "Prüfe package.json und package-lock.json"
    workingDirectory: $(Build.Repository.LocalPath)${{ parameters.projectPath }}

  - bash: |
      set -euo pipefail
      VERSION=$(node -p "require('./package.json').version")
      MAJOR_MINOR="$(echo "$VERSION" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1.\2/')"
      echo "##vso[task.setvariable variable=majorMinor]$MAJOR_MINOR"

      npm i --no-save semver --userconfig="${{ parameters.npmUserConfig }}"
      isPre=$(node -p "require('semver').prerelease(process.env.VERSION) !== null ? 'true' : 'false'")
      echo "##vso[task.setvariable variable=isPreRelease]$isPre"
      
      if [ "$isPre" = "true" ]; then
        VERSION_LABEL=$(node -e "const semver=require('semver'); const p=semver.prerelease(process.argv[1]); if(!p) process.exit(1); process.stdout.write(String(p[0]));" "$VERSION")
        echo "##vso[task.setvariable variable=versionLabel]$VERSION_LABEL"
      fi

      echo "##vso[task.setvariable variable=releaseNumber]$VERSION"
    displayName: "Ermittle Versionsnummer und Version-Label"
    workingDirectory: $(Build.Repository.LocalPath)${{ parameters.projectPath }}
