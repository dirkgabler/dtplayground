parameters:
  - name: workspacePath
    type: string

  - name: packagePath
    type: string

  - name: publishPath
    type: string

  - name: validatePackageVersion
    type: boolean
    default: true

steps:
  - checkout: self
    submodules: true
    persistCredentials: true
    clean: true
    displayName: Repository auschecken

  - bash: |
      set -euo pipefail

      NORMALIZED_PATH=''

      normalize_relative_path() {
        local raw_path="$1"
        local parameter_name="$2"
        local cleaned_path="${raw_path//\\//}"

        if [[ "${cleaned_path}" == /* ]]; then
          echo "##vso[task.logissue type=error]${parameter_name} muss relativ zum Repository sein. Absolute Pfade wie '${raw_path}' sind nicht erlaubt."
          exit 1
        fi

        while [[ "${cleaned_path}" == ./* ]]; do
          cleaned_path="${cleaned_path#./}"
        done

        while [[ "${cleaned_path}" == *"/./"* ]]; do
          cleaned_path="${cleaned_path//\/\.\//\/}"
        done

        cleaned_path="$(printf '%s' "${cleaned_path}" | sed -E 's#/+#/#g; s#/$##; s#/\.$##')"

        if [[ -z "${cleaned_path}" || "${cleaned_path}" == "." ]]; then
          NORMALIZED_PATH='.'
          return 0
        fi

        IFS='/' read -r -a path_segments <<< "${cleaned_path}"
        for path_segment in "${path_segments[@]}"; do
          if [[ -z "${path_segment}" || "${path_segment}" == "." || "${path_segment}" == ".." ]]; then
            echo "##vso[task.logissue type=error]${parameter_name} '${raw_path}' ist ungueltig. Pfadsegmente '.', '..' oder leere Segmente werden nicht unterstuetzt."
            exit 1
          fi
        done

        NORMALIZED_PATH="${cleaned_path}"
      }

      normalize_relative_path "${{ parameters.workspacePath }}" "workspacePath"
      WORKSPACE_RELATIVE_PATH="${NORMALIZED_PATH}"

      normalize_relative_path "${{ parameters.packagePath }}" "packagePath"
      PACKAGE_RELATIVE_PATH="${NORMALIZED_PATH}"

      normalize_relative_path "${{ parameters.publishPath }}" "publishPath"
      PUBLISH_RELATIVE_PATH="${NORMALIZED_PATH}"

      if [[ "${WORKSPACE_RELATIVE_PATH}" == "." ]]; then
        WORKSPACE_WORKING_PATH="$(Build.SourcesDirectory)"
      else
        WORKSPACE_WORKING_PATH="$(Build.SourcesDirectory)/${WORKSPACE_RELATIVE_PATH}"
      fi

      if [[ "${PACKAGE_RELATIVE_PATH}" == "." ]]; then
        PACKAGE_WORKING_PATH="$(Build.SourcesDirectory)"
      else
        PACKAGE_WORKING_PATH="$(Build.SourcesDirectory)/${PACKAGE_RELATIVE_PATH}"
      fi

      if [[ "${PUBLISH_RELATIVE_PATH}" == "." ]]; then
        PUBLISH_WORKING_PATH="$(Build.SourcesDirectory)"
      else
        PUBLISH_WORKING_PATH="$(Build.SourcesDirectory)/${PUBLISH_RELATIVE_PATH}"
      fi

      if [[ ! -d "${WORKSPACE_WORKING_PATH}" ]]; then
        echo "##vso[task.logissue type=error]workspacePath '${WORKSPACE_WORKING_PATH}' wurde nicht gefunden."
        exit 1
      fi

      if [[ ! -d "${PACKAGE_WORKING_PATH}" ]]; then
        echo "##vso[task.logissue type=error]packagePath '${PACKAGE_WORKING_PATH}' wurde nicht gefunden."
        exit 1
      fi

      echo "Verwende workspacePath '${WORKSPACE_RELATIVE_PATH}' (${WORKSPACE_WORKING_PATH})."
      echo "Verwende packagePath '${PACKAGE_RELATIVE_PATH}' (${PACKAGE_WORKING_PATH})."
      echo "Verwende publishPath '${PUBLISH_RELATIVE_PATH}' (${PUBLISH_WORKING_PATH})."
      echo "##vso[task.setvariable variable=workspacePathNormalized]${WORKSPACE_RELATIVE_PATH}"
      echo "##vso[task.setvariable variable=packagePathNormalized]${PACKAGE_RELATIVE_PATH}"
      echo "##vso[task.setvariable variable=publishPathNormalized]${PUBLISH_RELATIVE_PATH}"
      echo "##vso[task.setvariable variable=workspaceWorkingPath]${WORKSPACE_WORKING_PATH}"
      echo "##vso[task.setvariable variable=packageWorkingPath]${PACKAGE_WORKING_PATH}"
      echo "##vso[task.setvariable variable=publishWorkingPath]${PUBLISH_WORKING_PATH}"

      # Legacy-Aliasse fuer bestehende Validierungs-Templates.
      echo "##vso[task.setvariable variable=projectPathNormalized]${PACKAGE_RELATIVE_PATH}"
      echo "##vso[task.setvariable variable=projectWorkingPath]${PACKAGE_WORKING_PATH}"
    displayName: "Normalisiere Workspace-, Package- und Publish-Pfade"

  - bash: |
      set -euo pipefail
      if [ -f package.json ]; then
        echo "package.json found -> continue"
      else
        echo "##vso[task.logissue type=error]package.json erforderlich aber nicht gefunden"
        exit 1
      fi
    displayName: "Prüfe package.json"
    workingDirectory: $(packageWorkingPath)

  - bash: |
      set -euo pipefail
      if [ -f package-lock.json ]; then
        echo "package-lock.json found -> continue"
      else
        echo "##vso[task.logissue type=error]package-lock.json erforderlich aber nicht gefunden"
        exit 1
      fi
    displayName: "Prüfe package-lock.json"
    workingDirectory: $(workspaceWorkingPath)

  - bash: |
      set -euo pipefail
      node <<'NODE'
      const pkg = require('./package.json');
      const scripts =
        typeof pkg?.scripts === 'object' && pkg.scripts !== null ? pkg.scripts : {};
      const blockedScripts = ['preversion', 'version', 'postversion'].filter((name) =>
        Object.prototype.hasOwnProperty.call(scripts, name)
      );

      if (blockedScripts.length > 0) {
        console.error(
          `##vso[task.logissue type=error]package.json enthaelt nicht unterstuetzte npm Lifecycle-Skripte (${blockedScripts.join(', ')}). Das Template fuehrt 'npm version' mit deaktivierten Scripts aus. Konsumenten-Pipelines muessen die betroffene Logik gegebenenfalls in explizite Pipeline-Schritte oder Build-Kommandos migrieren.`
        );
        process.exit(1);
      }

      console.log('Keine blockierten npm Lifecycle-Skripte fuer npm version gefunden.');
      NODE
    displayName: "Prüfe blockierte npm version-Skripte"
    workingDirectory: $(packageWorkingPath)

  - bash: |
      set -euo pipefail
      node <<'NODE'
      const pkg = require('./package.json');
      const packageName = typeof pkg.name === 'string' ? pkg.name.trim() : '';
      const allowedScopes = ['bshweb', 'diamant', 'dida', 'idefx', 'kbn', 'shg'];

      if (!packageName) {
        console.error("##vso[task.logissue type=error]package.json muss ein nicht-leeres Feld 'name' enthalten.");
        process.exit(1);
      }

      const scopedNameMatch = packageName.match(/^@([^/]+)\/[^/]+$/);
      if (!scopedNameMatch) {
        console.error(`##vso[task.logissue type=error]package.json.name '${packageName}' ist ungueltig. Erwartet wird ein Scoped Package Name im Format '@scope/name'.`);
        process.exit(1);
      }

      const packageScopeName = scopedNameMatch[1];
      if (!allowedScopes.includes(packageScopeName)) {
        console.error(`##vso[task.logissue type=error]Der Scope '${packageScopeName}' aus package.json.name '${packageName}' ist nicht erlaubt. Erlaubte Scopes: ${allowedScopes.join(', ')}.`);
        process.exit(1);
      }

      const packageScope = `@${packageScopeName}`;
      const packageNameSlug = packageName.replace(/^@/, '').replace(/[\/@]+/g, '-');
      console.log(`Verwende Paketnamen '${packageName}' mit Scope '${packageScope}'.`);
      console.log(`##vso[task.setvariable variable=packageName]${packageName}`);
      console.log(`##vso[task.setvariable variable=packageNameSlug]${packageNameSlug}`);
      console.log(`##vso[task.setvariable variable=packageScope]${packageScope}`);
      NODE
    displayName: "Prüfe Scoped Package Name und erlaubte Scopes"
    workingDirectory: $(packageWorkingPath)

  - ${{ if eq(parameters.validatePackageVersion, true) }}:
      - bash: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./package.json');
          const version = typeof pkg.version === 'string' ? pkg.version.trim() : '';
          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;

          if (!version) {
            console.error("##vso[task.logissue type=error]package.json muss ein nicht-leeres Feld 'version' enthalten.");
            process.exit(1);
          }

          if (!semverPattern.test(version)) {
            console.error(`##vso[task.logissue type=error]package.json.version '${version}' ist ungueltig. Erwartet wird SemVer mit numerischem major.minor.patch, z. B. '1.2.3' oder '1.2.3-snapshot'.`);
            process.exit(1);
          }

          console.log(`Verwende gueltige SemVer-Version '${version}'.`);
          NODE
        displayName: "Prüfe SemVer-Version"
        workingDirectory: $(packageWorkingPath)

      - bash: |
          set -euo pipefail
          export VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR="$(echo "$VERSION" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1.\2/')"
          echo "##vso[task.setvariable variable=majorMinor]$MAJOR_MINOR"

          PRERELEASE_PART="$(node -e "const version = process.env.VERSION || ''; const match = version.match(/^[0-9]+\.[0-9]+\.[0-9]+-([^+]+)(?:\+.*)?$/); process.stdout.write(match ? match[1] : '');")"
          if [ -n "$PRERELEASE_PART" ]; then
            echo "##vso[task.setvariable variable=isPreRelease]true"
            VERSION_LABEL="${PRERELEASE_PART%%.*}"
            echo "##vso[task.setvariable variable=versionLabel]$VERSION_LABEL"
          else
            echo "##vso[task.setvariable variable=isPreRelease]false"
            echo "##vso[task.setvariable variable=versionLabel]"
          fi

          echo "##vso[task.setvariable variable=releaseNumber]$VERSION"
        displayName: "Ermittle Versionsnummer und Version-Label"
        workingDirectory: $(packageWorkingPath)
