parameters:
  # Pfad zur npm-Konfiguration fuer Installation und Publish.
  - name: npmUserConfig
    type: string
    default: '/home/kwazdo/.npmrc'

  # Relativer Pfad des zu bauenden npm-Projekts im Repository.
  - name: projectPath
    type: string
    default: '/'

  # Verzeichnisse, die optional als Pipeline-Artefakte veroeffentlicht werden.
  - name: artifactPath
    type: object
    default:
      - 'target/'

  # Liste der npm-Build-Kommandos, die nach npm ci ausgefuehrt werden.
  - name: npmBuildCmd
    type: object
    default:
      - 'run build'

  # Steuert, ob Build-Artefakte in der Pipeline publiziert werden.
  - name: publishBuildArtifacts
    type: boolean
    default: false

  # Steuert, ob der Pipeline-Lauf per Retention-Task aufbewahrt wird.
  - name: retention
    type: boolean
    default: true

  # Registry fuer Releases von release-Branches.
  - name: releaseRegistryUrl
    type: string
    default: "https://spu.sha.vrkw.de/nexus/repository/npm-releases/"

  # Registry fuer Builds von Default-Branches und Snapshots.
  - name: snapshotRegistryUrl
    type: string
    default: "https://spu.sha.vrkw.de/nexus/repository/npm-releases/"

  # Steuert, ob bei Release-Builds ein Git-Tag gepusht wird.
  - name: tagRelease
    type: boolean
    default: true

  # Name des Agent-Pools, auf dem die Jobs laufen.
  - name: agentPoolName
    type: string
    default: "Self-hosted Linux (SEU)"

  # Maximale Laufzeit je Job in Minuten.
  - name: timeoutInMinutes
    type: number
    default: 30

jobs:
  - job: build_default_branch_job
    condition: |
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/master'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/develop')
      )
    displayName: Default-Branch bauen
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      name: ${{ parameters.agentPoolName }}
    variables:
      branchRunCounter: $[ counter(variables['Build.SourceBranchName'], 1) ]
    steps:
      - template: templates/stepsPrepare.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}
          npmUserConfig: ${{ parameters.npmUserConfig }}

      - template: templates/stepsValidateDefaultBranch.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}

      - template: templates/stepsNpmBuildPublish.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}
          npmBuildCmd: ${{ parameters.npmBuildCmd }}
          npmUserConfig: ${{ parameters.npmUserConfig }}
          artifactPath: ${{ parameters.artifactPath }}
          publishBuildArtifacts: ${{ parameters.publishBuildArtifacts }}
          retention: ${{ parameters.retention }}
          publishRegistry: ${{ parameters.snapshotRegistryUrl }}
          publishTag: '$(versionLabel)'
          publishNpm: true

  - job: build_release_branch_job
    condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
    displayName: Release-Branch bauen
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      name: ${{ parameters.agentPoolName }}
    variables:
      branchRunCounter: $[ counter(variables['Build.SourceBranchName'], 1) ]
    steps:
      - template: templates/stepsPrepare.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}
          npmUserConfig: ${{ parameters.npmUserConfig }}

      - template: templates/stepsValidateReleaseBranch.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}

      - template: templates/stepsNpmBuildPublish.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}
          npmBuildCmd: ${{ parameters.npmBuildCmd }}
          npmUserConfig: ${{ parameters.npmUserConfig }}
          artifactPath: ${{ parameters.artifactPath }}
          publishBuildArtifacts: ${{ parameters.publishBuildArtifacts }}
          retention: ${{ parameters.retention }}
          publishRegistry: ${{ parameters.releaseRegistryUrl }}
          publishTag: 'release-$(majorMinor)'
          publishNpm: true
          tagRelease: ${{ parameters.tagRelease }}

  - job: build_other_branch_job
    condition: |
      and(
        not(
          or(
            eq(variables['Build.SourceBranch'], 'refs/heads/master'),
            eq(variables['Build.SourceBranch'], 'refs/heads/main'),
            eq(variables['Build.SourceBranch'], 'refs/heads/develop')
          )
        ),
        not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      )
    displayName: Sonstigen Branch bauen
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      name: ${{ parameters.agentPoolName }}
    variables:
      branchRunCounter: $[ counter(variables['Build.SourceBranchName'], 1) ]
    steps:
      - template: templates/stepsPrepare.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}
          npmUserConfig: ${{ parameters.npmUserConfig }}

      - template: templates/stepsNpmBuildPublish.yml
        parameters:
          projectPath: ${{ parameters.projectPath }}
          npmBuildCmd: ${{ parameters.npmBuildCmd }}
          npmUserConfig: ${{ parameters.npmUserConfig }}
          artifactPath: ${{ parameters.artifactPath }}
          publishBuildArtifacts: false
          publishNpm: false
