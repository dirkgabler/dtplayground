parameters:
  # Pfad zur npm-Konfiguration fuer Installation und Publish.
  - name: npmUserConfig
    type: string
    default: '/home/kwazdo/.npmrc'

  # Relativer Pfad des Angular-Workspace im Repository.
  - name: workspacePath
    type: string
    default: '.'

  # Relativer Pfad zum Library-Projekt mit package.json.
  - name: packagePath
    type: string

  # Relativer Pfad zum Build-Output, aus dem npm publish ausgefuehrt wird.
  - name: publishPath
    type: string

  # Shell-Kommandos, die im Workspace zum Bauen der Library ausgefuehrt werden.
  - name: buildCommands
    type: object

  # Verzeichnisse, die optional als Pipeline-Artefakte veroeffentlicht werden.
  - name: artifactPath
    type: object
    default:
      - 'dist/'

  # Steuert, ob Build-Artefakte in der Pipeline publiziert werden.
  - name: publishBuildArtifacts
    type: boolean
    default: false

  # Steuert, ob der Default-Branch-Pipeline-Lauf per Retention-Lease aufbewahrt wird.
  - name: retention
    type: boolean
    default: true

  # Anzahl der Retention-Tage fuer release/*-Builds.
  # Werte groesser als 36500 werden in Azure DevOps als "forever" angezeigt.
  - name: releaseRetentionDays
    type: number
    default: 36501

  # Registry fuer Releases von release-Branches.
  - name: releaseRegistryUrl
    type: string
    default: "https://spu.sha.vrkw.de/nexus/repository/npm-releases/"

  # Registry fuer Builds von Default-Branches und Snapshots.
  - name: snapshotRegistryUrl
    type: string
    default: "https://spu.sha.vrkw.de/nexus/repository/npm-releases/"

  # Steuert, ob bei Release-Builds ein Git-Tag gepusht wird.
  - name: tagRelease
    type: boolean
    default: true

  # Template fuer Git-Release-Tags, z. B. '$(packageNameSlug)-$(releaseNumber)'.
  - name: gitTagTemplate
    type: string
    default: '$(packageNameSlug)-$(releaseNumber)'

  # Name des Agent-Pools, auf dem die Jobs laufen.
  - name: agentPoolName
    type: string
    default: "Self-hosted Linux (SEU)"

  # Liste von Agent-Demands, die dem Pool uebergeben werden.
  - name: poolRequirements
    type: object
    default:
      - "NODE_VERSION -equals 24"

  # Maximale Laufzeit je Job in Minuten.
  - name: timeoutInMinutes
    type: number
    default: 30

jobs:
  - job: resolve_default_branch
    displayName: Default-Branch aus Azure DevOps ermitteln
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      name: ${{ parameters.agentPoolName }}
      demands:
        - ${{ each poolRequirement in parameters.poolRequirements }}:
            - ${{ poolRequirement }}
    steps:
      - checkout: none

      - task: Bash@3
        name: resolveDefaultBranch
        displayName: Default-Branch ermitteln
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
          BUILD_REPOSITORY_ID: $(Build.Repository.ID)
          BUILD_SOURCEBRANCH: $(Build.SourceBranch)
        inputs:
          targetType: inline
          script: |
            set -euo pipefail

            if [[ -z "${SYSTEM_ACCESSTOKEN:-}" ]]; then
              echo "##vso[task.logissue type=error]System.AccessToken ist leer. Stelle sicher, dass das Pipeline-Token fuer Skripte verfuegbar ist."
              exit 1
            fi

            if [[ -z "${SYSTEM_COLLECTIONURI:-}" || -z "${SYSTEM_TEAMPROJECTID:-}" || -z "${BUILD_REPOSITORY_ID:-}" ]]; then
              echo "##vso[task.logissue type=error]Erforderliche Azure-DevOps-Kontextvariablen fehlen. Erwartet: System.CollectionUri, System.TeamProjectId, Build.Repository.ID."
              exit 1
            fi

            API_URL="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/git/repositories/${BUILD_REPOSITORY_ID}?api-version=7.1"
            echo "Lese Repository-Metadaten aus Azure DevOps."

            RESPONSE="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
              --header "Content-Type: application/json" \
              "${API_URL}")"

            DEFAULT_BRANCH_REF="$(printf '%s' "${RESPONSE}" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).defaultBranch || '')")"

            if [[ -z "${DEFAULT_BRANCH_REF}" ]]; then
              echo "##vso[task.logissue type=error]Azure DevOps hat keinen Default-Branch fuer Repository '${BUILD_REPOSITORY_ID}' geliefert."
              exit 1
            fi

            IS_DEFAULT_BRANCH="false"
            if [[ "${BUILD_SOURCEBRANCH:-}" == "${DEFAULT_BRANCH_REF}" ]]; then
              IS_DEFAULT_BRANCH="true"
            fi

            echo "Azure-Default-Branch: ${DEFAULT_BRANCH_REF}"
            echo "Aktueller Branch: ${BUILD_SOURCEBRANCH:-}"
            echo "isDefaultBranch=${IS_DEFAULT_BRANCH}"
            echo "##vso[task.setvariable variable=defaultBranchRef;isOutput=true]${DEFAULT_BRANCH_REF}"
            echo "##vso[task.setvariable variable=isDefaultBranch;isOutput=true]${IS_DEFAULT_BRANCH}"

  - template: templates/jobsPackageBuild.yml
    parameters:
      jobName: build_default_branch_job
      branchType: default
      displayName: Default-Branch bauen
      validationTemplate: stepsValidateDefaultBranch.yml
      workspacePath: ${{ parameters.workspacePath }}
      packagePath: ${{ parameters.packagePath }}
      publishPath: ${{ parameters.publishPath }}
      npmUserConfig: ${{ parameters.npmUserConfig }}
      artifactPath: ${{ parameters.artifactPath }}
      npmBuildCmd: []
      buildCommands: ${{ parameters.buildCommands }}
      publishBuildArtifacts: ${{ parameters.publishBuildArtifacts }}
      ${{ if eq(parameters.retention, true) }}:
        retentionDays: 365
      ${{ if ne(parameters.retention, true) }}:
        retentionDays: 0
      publishRegistry: ${{ parameters.snapshotRegistryUrl }}
      publishTag: '$(versionLabel)'
      publishNpm: true
      tagRelease: false
      gitTagTemplate: ${{ parameters.gitTagTemplate }}
      agentPoolName: ${{ parameters.agentPoolName }}
      poolRequirements: ${{ parameters.poolRequirements }}
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

  - template: templates/jobsPackageBuild.yml
    parameters:
      jobName: build_release_branch_job
      branchType: release
      displayName: Release-Branch bauen
      validationTemplate: stepsValidateReleaseBranch.yml
      workspacePath: ${{ parameters.workspacePath }}
      packagePath: ${{ parameters.packagePath }}
      publishPath: ${{ parameters.publishPath }}
      npmUserConfig: ${{ parameters.npmUserConfig }}
      artifactPath: ${{ parameters.artifactPath }}
      npmBuildCmd: []
      buildCommands: ${{ parameters.buildCommands }}
      publishBuildArtifacts: ${{ parameters.publishBuildArtifacts }}
      retentionDays: ${{ parameters.releaseRetentionDays }}
      publishRegistry: ${{ parameters.releaseRegistryUrl }}
      publishTag: 'release-$(majorMinor)'
      publishNpm: true
      tagRelease: ${{ parameters.tagRelease }}
      gitTagTemplate: ${{ parameters.gitTagTemplate }}
      agentPoolName: ${{ parameters.agentPoolName }}
      poolRequirements: ${{ parameters.poolRequirements }}
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

  - template: templates/jobsPackageBuild.yml
    parameters:
      jobName: build_other_branch_job
      branchType: other
      displayName: Sonstigen Branch bauen
      workspacePath: ${{ parameters.workspacePath }}
      packagePath: ${{ parameters.packagePath }}
      publishPath: ${{ parameters.publishPath }}
      npmUserConfig: ${{ parameters.npmUserConfig }}
      artifactPath: ${{ parameters.artifactPath }}
      npmBuildCmd: []
      buildCommands: ${{ parameters.buildCommands }}
      publishBuildArtifacts: false
      retentionDays: 0
      publishRegistry: ''
      publishTag: ''
      publishNpm: false
      tagRelease: false
      gitTagTemplate: ${{ parameters.gitTagTemplate }}
      agentPoolName: ${{ parameters.agentPoolName }}
      poolRequirements: ${{ parameters.poolRequirements }}
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
